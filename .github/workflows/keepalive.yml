# Evita que Supabase pause el proyecto gratuito tras 7 días sin uso
# (por ejemplo, en vacaciones). Llama cada 3 días a una función que no
# devuelve ningún dato de la familia.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          eval "$(node -e "global.window={};require('./config.js');const c=window.APP_CONFIG;console.log('URL='+JSON.stringify(c.SUPABASE_URL)+'; KEY='+JSON.stringify(c.SUPABASE_ANON_KEY))")"
          if [ -z "$URL" ]; then echo "Supabase no configurado todavía"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
